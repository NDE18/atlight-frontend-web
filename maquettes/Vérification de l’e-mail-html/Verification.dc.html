<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atlight · Vérification de l’e-mail</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#007A59}a:hover{color:#00664B}
.vf-page{container:page / inline-size;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;color:#212121;background:#fff;-webkit-font-smoothing:antialiased}
.vf-page *{box-sizing:border-box}
.vf-page :focus-visible{outline:2px solid #007A59;outline-offset:2px}
.vf-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);min-height:inherit}
.vf-slot{display:flex;min-width:0}
.vf-slot > *{flex:1;min-width:0;display:flex}
.vf-pane{display:flex;flex-direction:column;align-items:center;padding:40px 24px;background:#fff;min-width:0}
.vf-col{width:100%;max-width:440px;margin:auto 0;display:flex;flex-direction:column;gap:20px}
.vf-mark{display:block;align-self:center;width:76px;height:76px;border-radius:18px;box-shadow:0 10px 24px rgba(0,100,74,.2);animation:vfPop .5s cubic-bezier(.2,1.4,.4,1) backwards}
.vf-top{display:flex;flex-direction:column;gap:9px}
.vf-steptext{font-size:14px;font-weight:500;color:#616161}
.vf-bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vf-bar{height:6px;border-radius:3px;background:#009970;animation:vfGrow .5s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:left}
.vf-step{animation:vfSlide .34s cubic-bezier(.2,.8,.2,1) backwards}
.vf-foot{margin:0;text-align:center;font-size:15px;color:#616161}
.vf-foot a{font-weight:700;text-decoration:none}
.vf-foot a:hover{text-decoration:underline}
.vf-done{display:flex;flex-direction:column;gap:20px;text-align:center;animation:vfSlide .34s cubic-bezier(.2,.8,.2,1) backwards}
.vf-burst{position:relative;align-self:center;width:180px;height:150px}
.vf-burst-core{position:absolute;left:52px;top:37px;width:76px;height:76px;border-radius:50%;background:#009970;color:#fff;display:flex;align-items:center;justify-content:center;animation:vfPop .5s cubic-bezier(.2,1.6,.4,1) backwards}
.vf-burst-core svg{width:44px;height:44px;fill:currentColor}
.vf-spark{position:absolute;width:34px;height:34px;border-radius:50%;background:#E6F5F1;color:#00664B;display:flex;align-items:center;justify-content:center;animation:vfSpark .7s cubic-bezier(.2,1.4,.4,1) backwards}
.vf-spark svg{width:20px;height:20px;fill:currentColor}
.vf-title{margin:0;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.01em}
.vf-lead{margin:0;font-size:16px;line-height:1.5;color:#616161}
.vf-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:54px;border-radius:12px;background:#009970;font-size:19px;font-weight:700;text-decoration:none;transition:background .15s,transform .12s,box-shadow .15s;box-shadow:0 8px 18px rgba(0,153,112,.24)}
a.vf-btn,a.vf-btn:hover{color:#fff}
.vf-btn:hover{background:#008A65}
.vf-btn:active{transform:scale(.985)}
.vf-ic{width:22px;height:22px;fill:currentColor;flex:none}
@keyframes vfPop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes vfGrow{from{transform:scaleX(0)}to{transform:none}}
@keyframes vfSlide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes vfSpark{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.vf-mark,.vf-bar,.vf-step,.vf-done,.vf-burst-core,.vf-spark{animation:none}}
@container page (max-width:900px){
  .vf-grid{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  .vf-pane{padding:0 24px 28px}
  .vf-col{margin:0 auto;gap:16px}
  .vf-mark{width:72px;height:72px;margin-top:-36px;position:relative;z-index:2;border:3px solid #fff;border-radius:20px}
  .vf-title{font-size:27px}
}
</style>
</helmet>
<div class="vf-page" style="min-height: {{rootH}}">
  <div class="vf-grid" style="min-height: {{rootH}}">
    <div class="vf-slot">
      <dc-import name="AuthPanel" hero="{{panelHero}}" sub="{{panelSub}}" locked-sport="{{lockedSport}}" show-profile="{{ true }}" fill="{{ true }}" hint-size="100%,100%"></dc-import>
    </div>
    <main class="vf-pane">
      <div class="vf-col">
        <img class="vf-mark" src="./assets/f84ce6484952aa053561c472341d1621.png" alt="Atlight" width="76" height="76">
        <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
          <div class="vf-top">
            <span class="vf-steptext">Étape 4 sur 4</span>
            <div class="vf-bars" aria-hidden="true"><div class="vf-bar"></div><div class="vf-bar"></div><div class="vf-bar"></div><div class="vf-bar"></div></div>
          </div>
          <div class="vf-step">
            <dc-import name="CodeStep" email="{{email}}" demo-state="{{demoState}}" on-verified="{{onVerified}}" on-email-change="{{setEmail}}" hint-size="100%,430px"></dc-import>
          </div>
          <p class="vf-foot"><a href="Main.dc.html">Retour à la connexion</a></p>
        </sc-if>
        <sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
          <div class="vf-done">
            <div class="vf-burst" aria-hidden="true">
              <sc-for list="{{sparks}}" as="sp" hint-placeholder-count="6">
                <span class="vf-spark" style="{{sp.style}}"><svg viewBox="0 0 24 24"><path d="{{sp.icon}}"></path></svg></span>
              </sc-for>
              <div class="vf-burst-core"><svg viewBox="0 0 24 24"><path d="{{i.tick}}"></path></svg></div>
            </div>
            <h1 class="vf-title">Votre compte est confirmé</h1>
            <p class="vf-lead">Connectez-vous pour compléter votre profil sportif et découvrir votre réseau.</p>
            <a class="vf-btn" href="Main.dc.html">Se connecter<svg class="vf-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{i.forward}}"></path></svg></a>
          </div>
        </sc-if>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"demoState":{"editor":"enum","options":["input","error","expired","done"],"default":"input"},"embedHeight":{"editor":null},"$preview":{"width":1440,"height":900}}'>

  { x: 142, y: 108, dx: -38, dy: -30, icon: 'M6 4.01C3.58 5.84 2 8.73 2 12c0 1.46.32 2.85.89 4.11L6 14.31V4.01zm5 7.41V2.05c-1.06.11-2.07.38-3 .79v10.32l3-1.74zm1 1.73-8.11 4.68c.61.84 1.34 1.59 2.18 2.2L15 14.89l-3-1.74zm1-5.19v3.46l8.11 4.68c.42-.93.7-1.93.82-2.98L13 7.96zM8.07 21.2c1.21.51 2.53.8 3.93.8 3.34 0 6.29-1.65 8.11-4.16L17 16.04 8.07 21.2zm13.85-10.39c-.55-4.63-4.26-8.3-8.92-8.76v3.6l8.92 5.16z' }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let email = null;
    let sport = null;
    if (!props.embedHeight) {
      try {
        email = sessionStorage.getItem('atlight.demo.email');
        sport = sessionStorage.getItem('atlight.demo.sport');
      } catch (e) {}
    }
    this.state = { done: props.demoState === 'done', email: email || 'awa.diallo@exemple.com', sport };
  }
  renderVals() {
    const s = this.state;
    const p = this.props;
    return {
      rootH: p.embedHeight ?? '100vh',
      email: s.email,
      lockedSport: s.sport || undefined,
      demoState: p.demoState && p.demoState !== 'input' && p.demoState !== 'done' ? p.demoState : (p.embedHeight ? 'input' : undefined),
      panelHero: s.done ? 'Bienvenue dans le jeu.' : 'Dernière ligne droite.',
      panelSub: s.done ? 'Athlètes, coachs, managers, agents et journalistes vous attendent, quel que soit votre sport.' : 'Encore un code, et votre profil sportif prend vie.',
      notDone: !s.done,
      isDone: s.done,
      onVerified: () => this.setState({ done: true }),
      setEmail: (v) => this.setState({ email: v }),
      sparks: SPARKS.map((x, n) => ({
        icon: x.icon,
        style: 'left:' + x.x + 'px;top:' + x.y + 'px;--dx:' + x.dx + 'px;--dy:' + x.dy + 'px;animation-delay:' + (120 + n * 45) + 'ms'
      })),
      i: {
        tick: 'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
        forward: 'm12 4-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z'
      }
    };
  }
}
</script>
</body>
</html>
