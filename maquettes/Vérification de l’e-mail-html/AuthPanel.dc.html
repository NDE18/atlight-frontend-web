<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atlight · Panneau multisport</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ap-root{container:panel / inline-size;display:flex;flex:1 1 100%;width:100%;min-width:0;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.ap-root *{box-sizing:border-box}
.ap{--pad:clamp(28px,8cqi,64px);position:relative;overflow:hidden;flex:1;min-width:0;background:#009970;color:#fff;padding:44px var(--pad) 26px;display:flex;flex-direction:column;gap:22px}
.ap-floor{position:absolute;right:-250px;bottom:-330px;width:900px;height:900px;transform:perspective(1500px) rotateX(50deg) rotateZ(-26deg);pointer-events:none}
.ap-scene{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:#fff;stroke-opacity:.34;stroke-width:3;opacity:0;transition:opacity .55s ease}
.ap-scene *{stroke-dasharray:1;stroke-dashoffset:0}
.ap-scene.on{opacity:1}
.ap-scene.on *{animation:apDraw 1.7s cubic-bezier(.3,.7,.2,1) backwards}
.ap-main{position:relative;margin:auto 0;display:flex;flex-direction:column;gap:20px;min-width:0}
.ap-tag{display:inline-flex;align-items:center;gap:7px;width:max-content;height:38px;padding:0 14px 0 10px;border-radius:19px;background:#fff;color:#00664B;font-size:14px;font-weight:700}
.ap-ic{width:20px;height:20px;fill:currentColor;flex:none;display:block}
.ap-tag-swap{display:inline-flex;align-items:center;gap:7px}
.ap-tag-swap.a0{animation:apSwapA .4s ease-out}
.ap-tag-swap.a1{animation:apSwapB .4s ease-out}
.ap-hero{margin:0;font-size:clamp(36px,9.4cqi,74px);line-height:1.02;font-weight:900;font-style:italic;letter-spacing:-.02em;text-wrap:balance}
.ap-hero.fixed{max-width:11.5ch}
.ap-hero.fixed.a0{animation:apSwapA .42s cubic-bezier(.2,.8,.2,1)}
.ap-hero.fixed.a1{animation:apSwapB .42s cubic-bezier(.2,.8,.2,1)}
.ap-line{display:block}
.ap-wordbox{display:block;overflow:hidden;padding:.06em .12em .1em 0;margin:-.06em 0 -.1em}
.ap-word{display:block;white-space:nowrap}
.ap-word.a0{animation:apWordA .55s cubic-bezier(.2,.9,.2,1)}
.ap-word.a1{animation:apWordB .55s cubic-bezier(.2,.9,.2,1)}
.ap-sub{margin:0;font-size:19px;line-height:1.38;font-weight:700;max-width:31em}
.ap-hide{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ap-stage{position:relative;height:166px;margin-top:6px}
.ap-card{position:absolute;left:0;top:20px;width:min(100%,430px);background:#fff;color:#212121;border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:center;box-shadow:0 18px 44px rgba(0,60,44,.3);animation:apFloat 7s ease-in-out infinite}
.ap-card-in{display:flex;gap:16px;align-items:center;min-width:0;width:100%}
.ap-card-in.a0{animation:apSwapA .42s ease-out}
.ap-card-in.a1{animation:apSwapB .42s ease-out}
.ap-av{position:relative;width:92px;height:92px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex:none}
.ap-ott{position:absolute;inset:0;width:100%;height:100%}
.ap-who{min-width:0;display:flex;flex-direction:column;gap:4px}
.ap-name{display:flex;align-items:center;gap:5px;font-size:18px;font-weight:700;line-height:1.25}
.ap-role{font-size:14px;color:#616161;line-height:1.3}
.ap-chip{display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:5px 10px 5px 7px;border-radius:8px;background:#E6F5F1;color:#00664B;font-size:13px;font-weight:500;width:max-content;max-width:100%}
.ap-react{position:absolute;left:min(calc(100% - 210px),236px);top:0;display:flex;gap:3px;padding:6px 9px;background:#fff;border-radius:20px;box-shadow:0 10px 24px rgba(0,60,44,.28);animation:apFloat 7s ease-in-out -2.4s infinite}
.ap-react svg{width:25px;height:25px;display:block}
.ap-perks{list-style:none;margin:6px 0 0;padding:8px 18px;background:#fff;color:#212121;border-radius:16px;max-width:430px;box-shadow:0 18px 44px rgba(0,60,44,.28)}
.ap-perks.a0{animation:apSwapA .42s cubic-bezier(.2,.8,.2,1)}
.ap-perks.a1{animation:apSwapB .42s cubic-bezier(.2,.8,.2,1)}
.ap-perk{display:flex;align-items:center;gap:13px;padding:10px 0;font-size:15px;line-height:1.35;border-bottom:1px solid #EEEEEE}
.ap-perk:last-child{border-bottom:0}
.ap-perk-ic{width:36px;height:36px;border-radius:50%;background:#E6F5F1;color:#00664B;display:flex;align-items:center;justify-content:center;flex:none}
.ap-ticker{position:relative;margin-inline:calc(var(--pad) * -1);overflow:hidden;flex:none}
.ap-track{display:flex;gap:8px;width:max-content;animation:apTicker 46s linear infinite}
.ap-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px 0 9px;border-radius:18px;background:rgba(255,255,255,.96);color:#00664B;font-size:14px;font-weight:700;flex:none;transition:background .3s,color .3s}
.ap-pill.on{background:#9AEED7;color:#00392B}
@keyframes apDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes apFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes apTicker{to{transform:translateX(-50%)}}
@keyframes apSwapA{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes apSwapB{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes apWordA{from{opacity:0;transform:translateY(70%)}to{opacity:1;transform:none}}
@keyframes apWordB{from{opacity:0;transform:translateY(70%)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .ap-scene.on *,.ap-card,.ap-react,.ap-track,.ap-word,.ap-hero.fixed,.ap-card-in,.ap-perks,.ap-tag-swap{animation:none}
}
@container page (max-width:900px){
  .ap{padding:16px 24px 46px;gap:10px}
  .ap-floor{right:-290px;bottom:-470px;width:620px;height:620px}
  .ap-main{margin:0;gap:8px}
  .ap-hero{font-size:27px}
  .ap-hero.fixed{max-width:none}
  .ap-sub,.ap-stage,.ap-perks,.ap-tag{display:none}
  .ap-ticker{margin-inline:-24px}
  .ap-pill{height:32px;font-size:13px}
}
</style>
</helmet>
<div class="ap-root" style="min-height: {{rootH}}">
  <section class="ap" aria-label="Atlight, le réseau professionnel de tous les sports">
    <div class="ap-floor" aria-hidden="true">
      <svg class="ap-scene {{s.football}}" viewBox="0 0 880 880">
        <rect x="100" y="40" width="680" height="800" pathLength="1"></rect>
        <line x1="100" y1="440" x2="780" y2="440" pathLength="1"></line>
        <circle cx="440" cy="440" r="92" pathLength="1"></circle>
        <rect x="250" y="40" width="380" height="136" pathLength="1"></rect>
        <rect x="340" y="40" width="200" height="50" pathLength="1"></rect>
        <path d="M372 176a84 84 0 0 0 136 0" pathLength="1"></path>
        <rect x="250" y="704" width="380" height="136" pathLength="1"></rect>
        <rect x="340" y="790" width="200" height="50" pathLength="1"></rect>
        <path d="M372 704a84 84 0 0 1 136 0" pathLength="1"></path>
      </svg>
      <svg class="ap-scene {{s.basket}}" viewBox="0 0 880 880">
        <rect x="120" y="40" width="640" height="800" pathLength="1"></rect>
        <line x1="120" y1="440" x2="760" y2="440" pathLength="1"></line>
        <circle cx="440" cy="440" r="72" pathLength="1"></circle>
        <rect x="340" y="40" width="200" height="224" pathLength="1"></rect>
        <circle cx="440" cy="264" r="72" pathLength="1"></circle>
        <path d="M170 40v120a270 270 0 0 0 540 0V40" pathLength="1"></path>
        <rect x="340" y="616" width="200" height="224" pathLength="1"></rect>
        <circle cx="440" cy="616" r="72" pathLength="1"></circle>
        <path d="M170 840V720a270 270 0 0 1 540 0v120" pathLength="1"></path>
      </svg>
      <svg class="ap-scene {{s.athle}}" viewBox="0 0 880 880">
        <rect x="120" y="50" width="640" height="780" rx="320" pathLength="1"></rect>
        <rect x="160" y="90" width="560" height="700" rx="280" pathLength="1"></rect>
        <rect x="200" y="130" width="480" height="620" rx="240" pathLength="1"></rect>
        <rect x="240" y="170" width="400" height="540" rx="200" pathLength="1"></rect>
        <rect x="280" y="210" width="320" height="460" rx="160" pathLength="1"></rect>
        <line x1="120" y1="440" x2="280" y2="440" pathLength="1"></line>
        <line x1="600" y1="370" x2="760" y2="370" pathLength="1"></line>
      </svg>
      <svg class="ap-scene {{s.tennis}}" viewBox="0 0 880 880">
        <rect x="190" y="50" width="500" height="780" pathLength="1"></rect>
        <line x1="252" y1="50" x2="252" y2="830" pathLength="1"></line>
        <line x1="628" y1="50" x2="628" y2="830" pathLength="1"></line>
        <line x1="150" y1="440" x2="730" y2="440" pathLength="1" stroke-width="6"></line>
        <line x1="252" y1="240" x2="628" y2="240" pathLength="1"></line>
        <line x1="252" y1="640" x2="628" y2="640" pathLength="1"></line>
        <line x1="440" y1="240" x2="440" y2="640" pathLength="1"></line>
      </svg>
      <svg class="ap-scene {{s.rugby}}" viewBox="0 0 880 880">
        <rect x="130" y="30" width="620" height="820" pathLength="1"></rect>
        <line x1="130" y1="120" x2="750" y2="120" pathLength="1"></line>
        <line x1="130" y1="760" x2="750" y2="760" pathLength="1"></line>
        <line x1="130" y1="280" x2="750" y2="280" pathLength="1"></line>
        <line x1="130" y1="600" x2="750" y2="600" pathLength="1"></line>
        <line x1="130" y1="440" x2="750" y2="440" pathLength="1"></line>
        <path d="M400 80v80M480 80v80M400 112h80M400 720v80M480 720v80M400 768h80" pathLength="1"></path>
      </svg>
      <svg class="ap-scene {{s.natation}}" viewBox="0 0 880 880">
        <rect x="120" y="40" width="640" height="800" pathLength="1"></rect>
        <line x1="200" y1="40" x2="200" y2="840" pathLength="1"></line>
        <line x1="280" y1="40" x2="280" y2="840" pathLength="1"></line>
        <line x1="360" y1="40" x2="360" y2="840" pathLength="1"></line>
        <line x1="440" y1="40" x2="440" y2="840" pathLength="1"></line>
        <line x1="520" y1="40" x2="520" y2="840" pathLength="1"></line>
        <line x1="600" y1="40" x2="600" y2="840" pathLength="1"></line>
        <line x1="680" y1="40" x2="680" y2="840" pathLength="1"></line>
        <line x1="120" y1="150" x2="760" y2="150" pathLength="1"></line>
        <line x1="120" y1="730" x2="760" y2="730" pathLength="1"></line>
      </svg>
      <svg class="ap-scene {{s.volley}}" viewBox="0 0 880 880">
        <rect x="170" y="100" width="540" height="680" pathLength="1"></rect>
        <line x1="130" y1="440" x2="750" y2="440" pathLength="1" stroke-width="6"></line>
        <line x1="170" y1="320" x2="710" y2="320" pathLength="1"></line>
        <line x1="170" y1="560" x2="710" y2="560" pathLength="1"></line>
      </svg>
      <svg class="ap-scene {{s.boxe}}" viewBox="0 0 880 880">
        <rect x="130" y="130" width="620" height="620" pathLength="1"></rect>
        <rect x="170" y="170" width="540" height="540" pathLength="1"></rect>
        <rect x="210" y="210" width="460" height="460" pathLength="1"></rect>
        <circle cx="130" cy="130" r="22" pathLength="1"></circle>
        <circle cx="750" cy="130" r="22" pathLength="1"></circle>
        <circle cx="130" cy="750" r="22" pathLength="1"></circle>
        <circle cx="750" cy="750" r="22" pathLength="1"></circle>
        <circle cx="440" cy="440" r="86" pathLength="1"></circle>
      </svg>
      <svg class="ap-scene {{s.handball}}" viewBox="0 0 880 880">
        <rect x="120" y="40" width="640" height="800" pathLength="1"></rect>
        <line x1="120" y1="440" x2="760" y2="440" pathLength="1"></line>
        <path d="M230 40a210 210 0 0 0 420 0" pathLength="1"></path>
        <path d="M170 40a270 270 0 0 0 540 0" pathLength="1"></path>
        <path d="M230 840a210 210 0 0 1 420 0" pathLength="1"></path>
        <path d="M170 840a270 270 0 0 1 540 0" pathLength="1"></path>
      </svg>
      <svg class="ap-scene {{s.cyclisme}}" viewBox="0 0 880 880">
        <rect x="130" y="40" width="620" height="800" rx="310" pathLength="1"></rect>
        <rect x="185" y="95" width="510" height="690" rx="255" pathLength="1"></rect>
        <rect x="240" y="150" width="400" height="580" rx="200" pathLength="1"></rect>
        <line x1="130" y1="440" x2="240" y2="440" pathLength="1" stroke-width="6"></line>
      </svg>
      <svg class="ap-scene {{s.judo}}" viewBox="0 0 880 880">
        <rect x="110" y="110" width="660" height="660" pathLength="1"></rect>
        <rect x="210" y="210" width="460" height="460" pathLength="1"></rect>
        <line x1="400" y1="390" x2="400" y2="490" pathLength="1"></line>
        <line x1="480" y1="390" x2="480" y2="490" pathLength="1"></line>
      </svg>
      <svg class="ap-scene {{s.gym}}" viewBox="0 0 880 880">
        <rect x="120" y="120" width="640" height="640" pathLength="1"></rect>
        <rect x="170" y="170" width="540" height="540" pathLength="1"></rect>
        <line x1="170" y1="170" x2="710" y2="710" pathLength="1"></line>
        <line x1="710" y1="170" x2="170" y2="710" pathLength="1"></line>
      </svg>
    </div>

    <div class="ap-main">
      <sc-if value="{{isRotating}}" hint-placeholder-val="{{ true }}">
        <p class="ap-hero">
          <span class="ap-line">Le réseau professionnel</span>
          <span class="ap-hide">de tous les sports.</span>
          <span class="ap-wordbox" aria-hidden="true"><span class="ap-word {{swap}}">{{sport.phrase}}</span></span>
        </p>
      </sc-if>
      <sc-if value="{{isFixed}}" hint-placeholder-val="{{ false }}">
        <span class="ap-tag" aria-hidden="true"><span class="ap-tag-swap {{swap}}"><svg class="ap-ic" viewBox="0 0 24 24"><path d="{{sport.icon}}"></path></svg>{{sport.label}}</span></span>
        <p class="ap-hero fixed {{heroAnim}}">{{hero}}</p>
      </sc-if>
      <sc-if value="{{hasSub}}" hint-placeholder-val="{{ false }}"><p class="ap-sub">{{sub}}</p></sc-if>

      <sc-if value="{{showProfile}}" hint-placeholder-val="{{ false }}">
        <div class="ap-stage" aria-hidden="true">
          <div class="ap-card">
            <div class="ap-card-in {{swap}}">
              <div class="ap-av" style="background: {{sport.bg}}; color: {{sport.fg}}">
                <span>{{sport.ini}}</span>
                <sc-if value="{{sport.ott}}" hint-placeholder-val="{{ false }}">
                  <svg class="ap-ott" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="42.5" fill="none" stroke="#009970" stroke-width="15"></circle>
                    <defs><path id="ap-ott-arc" d="M3.8 50A46.2 46.2 0 0 0 96.2 50"></path></defs>
                    <text font-size="9.6" font-weight="700" fill="#fff" letter-spacing=".55" font-family="Roboto, sans-serif"><textPath href="#ap-ott-arc" startOffset="50%" text-anchor="middle">OPEN TO TRYOUTS</textPath></text>
                  </svg>
                </sc-if>
              </div>
              <div class="ap-who">
                <div class="ap-name">{{sport.name}}<sc-if value="{{sport.verified}}" hint-placeholder-val="{{ false }}"><svg class="ap-ic" viewBox="0 0 24 24" style="fill:#009970;width:18px;height:18px"><path d="{{i.verified}}"></path></svg></sc-if></div>
                <div class="ap-role">{{sport.role}}</div>
                <div class="ap-chip"><svg class="ap-ic" viewBox="0 0 24 24" style="width:16px;height:16px"><path d="{{sport.icon}}"></path></svg>{{sport.chip}}</div>
              </div>
            </div>
          </div>
          <div class="ap-react">
            <svg viewBox="0 0 24 24" style="fill:#FFC400"><path d="{{i.gold}}"></path></svg>
            <svg viewBox="0 0 24 24" style="fill:#607D8B"><path d="{{i.medal}}"></path></svg>
            <svg viewBox="0 0 24 24" style="fill:#FFC107"><path d="{{i.medal}}"></path></svg>
            <svg viewBox="0 0 24 24" style="fill:#4CAF50"><path d="{{i.goal}}"></path></svg>
            <svg viewBox="0 0 24 24" style="fill:#FF9800"><path d="{{i.whistle}}"></path></svg>
            <svg viewBox="0 0 24 24" style="fill:#FF5252"><path d="{{i.strong}}"></path></svg>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{hasPerks}}" hint-placeholder-val="{{ false }}">
        <ul class="ap-perks {{heroAnim}}">
          <sc-for list="{{perks}}" as="p" hint-placeholder-count="3">
            <li class="ap-perk"><span class="ap-perk-ic"><svg class="ap-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span><span>{{p.text}}</span></li>
          </sc-for>
        </ul>
      </sc-if>
    </div>

    <div class="ap-ticker" aria-hidden="true">
      <div class="ap-track">
        <sc-for list="{{ticker}}" as="t" hint-placeholder-count="12">
          <span class="ap-pill {{t.cls}}"><svg class="ap-ic" viewBox="0 0 24 24"><path d="{{t.icon}}"></path></svg>{{t.label}}</span>
        </sc-for>
      </div>
    </div>
  </section>
</div>
