name: CI/CD

# Qualité et tests sur chaque push et pull request ; sur main, image Docker publiée sur GHCR
# puis déployée sur le VPS Contabo (https://web.atlight.fr). Mise en place : docs/deploiement.md.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_BASE_URL: https://atlight.fr
  NEXT_PUBLIC_WS_URL: wss://atlight.fr/ws
  NEXT_PUBLIC_SHARE_BASE_URL: https://atlight.fr

jobs:
  quality:
    name: Qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Traductions FR/EN cohérentes
        run: npm run i18n:check
      - name: Mise en forme (Prettier)
        run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests unitaires
        run: npm run test
      - run: npm run build
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      # Les routes du BFF sont simulées (e2e/fixtures.ts) : aucun appel au backend de production.
      - name: Tests E2E (bureau et mobile)
        run: npm run test:e2e
      - name: Traces des tests E2E en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  image:
    name: Image Docker
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Nom et tag de l'image
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Valeurs publiques, figées dans le bundle. Par défaut, la config « web » de Firebase du mobile
      # (lib/firebase_options.dart) ; une variable du dépôt du même nom la remplace.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_SHARE_BASE_URL=${{ env.NEXT_PUBLIC_SHARE_BASE_URL }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyCqaSzoAvy9fgeJyOcbrkEet1mj2-h4bu8' }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'atlight-app.firebaseapp.com' }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'atlight-app' }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'atlight-app.firebasestorage.app' }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '329948153339' }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:329948153339:web:96d0e0e1cab4941c70775e' }}
            NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
            NEXT_PUBLIC_FIREBASE_VAPID_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
            NEXT_DEPLOYMENT_ID=${{ steps.meta.outputs.tag }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # L'image est démarrée telle qu'elle sera déployée : sonde, page de connexion, fichiers statiques.
      - name: Essai de l'image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          docker run -d --name web-smoke -p 3000:3000 -e APP_VERSION=smoke "$IMAGE"
          trap 'docker logs web-smoke; docker rm -f web-smoke >/dev/null' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health 2>/dev/null | grep -q '"version":"smoke"' && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          echo
          html="$(curl -fsS -H 'Accept-Language: fr' http://127.0.0.1:3000/login)"
          grep -q 'Content de vous revoir' <<<"$html"
          asset="$(grep -o '/_next/static/[^"?]*\.js' <<<"$html" | head -1)"
          test -n "$asset"
          curl -fsS -o /dev/null "http://127.0.0.1:3000$asset"
          echo "Image OK ($asset servi)"
      - name: Publication sur GHCR
        run: docker push --all-tags "${{ steps.meta.outputs.image }}"

  deploy:
    name: Déploiement (web.atlight.fr)
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://web.atlight.fr
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      DOMAIN: web.atlight.fr
      IMAGE: ${{ needs.image.outputs.image }}
      TAG: ${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Copie et exécution de deploy/deploy.sh sur le VPS
        env:
          # Mêmes secrets que le déploiement du backend (atlight-backend), à créer aussi dans ce dépôt.
          SSH_HOST: ${{ secrets.CONTABO_HOST || '157.173.118.249' }}
          SSH_PORT: ${{ secrets.CONTABO_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.CONTABO_SSH_USER }}
          SSH_KEY: ${{ secrets.CONTABO_SSH_KEY }}
          SSHPASS: ${{ secrets.CONTABO_SSH_PASSWORD }}
          KNOWN_HOSTS: ${{ secrets.CONTABO_SSH_KNOWN_HOSTS }}
          WEB_PORT: ${{ vars.WEB_PORT || '3100' }}
          LETSENCRYPT_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$SSH_USER" ]; then
            echo "::error::Secret CONTABO_SSH_USER manquant (voir docs/deploiement.md)."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::Secret CONTABO_SSH_KNOWN_HOSTS absent : l'empreinte du serveur est acceptée sans vérification."
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          opts=(-o StrictHostKeyChecking=yes)
          if [ -n "$SSH_KEY" ]; then
            install -m 600 /dev/null ~/.ssh/id_deploy
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
            ssh=(ssh "${opts[@]}" -o BatchMode=yes -i ~/.ssh/id_deploy)
            scp=(scp "${opts[@]}" -o BatchMode=yes -i ~/.ssh/id_deploy)
          elif [ -n "$SSHPASS" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null
            ssh=(sshpass -e ssh "${opts[@]}")
            scp=(sshpass -e scp "${opts[@]}")
          else
            echo "::error::Définir le secret CONTABO_SSH_KEY (recommandé) ou CONTABO_SSH_PASSWORD."
            exit 1
          fi
          remote="$SSH_USER@$SSH_HOST"
          "${ssh[@]}" -p "$SSH_PORT" "$remote" 'mkdir -p ~/atlight-web/nginx'
          "${scp[@]}" -P "$SSH_PORT" deploy/compose.yml deploy/deploy.sh "$remote:atlight-web/"
          "${scp[@]}" -P "$SSH_PORT" deploy/nginx/acme.conf deploy/nginx/site.conf "$remote:atlight-web/nginx/"
          # Le jeton GHCR passe par l'entrée standard : il n'apparaît dans aucune ligne de commande.
          printf '%s' "$GHCR_TOKEN" | "${ssh[@]}" -p "$SSH_PORT" "$remote" \
            "WEB_IMAGE='$IMAGE' WEB_IMAGE_TAG='$TAG' WEB_DOMAIN='$DOMAIN' WEB_PORT='$WEB_PORT' LETSENCRYPT_EMAIL='$LETSENCRYPT_EMAIL' GHCR_USER='$GITHUB_ACTOR' bash ~/atlight-web/deploy.sh"
      - name: Vérification publique
        run: |
          for _ in $(seq 1 10); do
            body="$(curl -fsS --max-time 10 "https://$DOMAIN/api/health" || true)"
            if grep -q "\"version\":\"$TAG\"" <<<"$body"; then
              echo "https://$DOMAIN est en ligne : $body"
              exit 0
            fi
            sleep 6
          done
          echo "::error::https://$DOMAIN/api/health ne renvoie pas la version $TAG (reçu : ${body:-rien})."
          exit 1
