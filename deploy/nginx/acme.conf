# Configuration provisoire de __DOMAIN__, le temps d'obtenir le certificat Let's Encrypt
# (défi HTTP sur le port 80). deploy.sh la remplace ensuite par site.conf.
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
