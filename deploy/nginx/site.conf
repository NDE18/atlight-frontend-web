# __DOMAIN__ → conteneur Next.js (127.0.0.1:__PORT__). Installé et tenu à jour par deploy.sh :
# toute modification se fait ici, dans le dépôt, pas sur le serveur.
# Certificat Let's Encrypt par webroot (/var/www/certbot), renouvelé par le timer de certbot.

upstream atlight_web {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Fichiers relayés par le BFF vers le backend (photo de profil, médias).
    client_max_body_size 25m;

    location / {
        proxy_pass http://atlight_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx est le point d'entrée : l'IP vue ici remplace tout X-Forwarded-For envoyé par le
        # client, qui ne peut donc pas contourner le limiteur de débit du backend (IP relayée par le BFF).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        # Rendu en streaming des Server Components (Suspense) : pas de mise en tampon.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
